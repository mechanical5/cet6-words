<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六级单词</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #fafafa; color: #222; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
  .app { width: 100%; max-width: 520px; display: flex; flex-direction: column; height: 95vh; }
  .topbar { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #999; padding: 8px 4px 20px; }
  .topbar .right { display: flex; gap: 8px; }
  .topbar button { background: none; border: none; font-size: 14px; color: #999; cursor: pointer; padding: 4px 8px; }
  .topbar button:hover { color: #222; }
  .progress-container { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .progress-text { font-size: 12px; color: #999; }
  .progress-bar-bg { width: 80px; height: 4px; background: #eee; border-radius: 2px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: #4caf50; width: 0%; transition: width .3s; }
  .card { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px 16px; position: relative; overflow-y: auto; }
  .word-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
  .word { font-size: 42px; font-weight: 600; letter-spacing: .5px; word-break: break-word; }
  .speak-btn { background: none; border: 1px solid #e0e0e0; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; flex-shrink: 0; }
  .speak-btn:hover { border-color: #999; background: #f5f5f5; }
  .phonetic { font-size: 17px; color: #888; margin-bottom: 28px; font-family: "Times New Roman", serif; }
  .details { width: 100%; text-align: left; opacity: 0; transition: opacity .25s; display: none; }
  .revealed .details { opacity: 1; display: block; }
  .section { margin-bottom: 18px; }
  .section-title { font-size: 12px; color: #bbb; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .def-cn { font-size: 16px; color: #222; line-height: 1.55; margin-bottom: 4px; }
  .example-en { font-size: 15px; color: #333; line-height: 1.6; font-style: italic; margin-bottom: 4px; }
  .example-cn { font-size: 14px; color: #999; line-height: 1.5; }
  .hint { font-size: 14px; color: #ccc; margin-top: 20px; }
  .revealed .hint { display: none; }
  .nav { display: flex; gap: 12px; padding: 16px 4px; }
  .nav button { flex: 1; padding: 14px; border: 1px solid #e0e0e0; background: #fff; border-radius: 10px; font-size: 16px; color: #444; cursor: pointer; transition: all .15s; }
  .nav button:hover { border-color: #bbb; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .master-btn { margin-top: 10px; margin-bottom: 20px; padding: 10px 20px; border: 1px solid #4caf50; background: #fff; color: #4caf50; border-radius: 20px; font-size: 14px; cursor: pointer; transition: all .2s; display: inline-block; }
  .master-btn:hover { background: #4caf50; color: #fff; }
  .group-list { flex: 1; overflow-y: auto; padding-right: 4px; }
  .group-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: #fff; border-radius: 10px; margin-bottom: 10px; cursor: pointer; border: 1px solid #eee; }
  .group-item:hover { border-color: #ccc; }
  .group-item.today { border-color: #222; }
  .group-item .label { font-size: 16px; }
  .group-item .meta { font-size: 13px; color: #999; }
  .group-item .done { color: #4caf50; font-size: 18px; }
  .settings { flex: 1; overflow-y: auto; }
  .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 18px 4px; border-bottom: 1px solid #eee; }
  .setting-row label { font-size: 16px; }
  .setting-row select, .setting-row input { font-size: 16px; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
  .switch { position: relative; display: inline-block; width: 48px; height: 28px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ccc; border-radius: 28px; transition: .2s; }
  .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: #222; }
  .switch input:checked + .slider:before { transform: translateX(20px); }
  .danger-btn { margin-top: 32px; width: 100%; padding: 14px; background: #fff; border: 1px solid #e57373; color: #e57373; border-radius: 10px; font-size: 16px; cursor: pointer; }
  .danger-btn:hover { background: #fff5f5; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div id="studyView" style="display:flex; flex-direction:column; height:100%;">
    <div class="topbar">
      <span id="dayLabel"></span>
      <div class="progress-container" id="progressBox">
        <div class="progress-text" id="progressText">0 / 0</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
      </div>
      <span class="right">
        <button onclick="showList()">分组</button>
        <button onclick="showMastered()">熟词区</button>
        <button onclick="showSettings()">设置</button>
      </span>
    </div>
    <div class="card" id="card" onclick="reveal()">
      <div class="word-row" onclick="event.stopPropagation()">
        <div class="word" id="word"></div>
        <button class="speak-btn" onclick="speakWord()" title="朗读单词">🔊</button>
      </div>
      <div class="phonetic" id="phonetic"></div>
      <div class="details" id="details">
        <div class="section">
          <div class="section-title">中文翻译</div>
          <div id="defCn"></div>
        </div>
        <div class="section">
          <div class="section-title">例句</div>
          <div class="example-en" id="exampleEn"></div>
          <div class="example-cn" id="exampleCn"></div>
        </div>
        <div style="text-align: center;">
          <button class="master-btn" onclick="event.stopPropagation(); markMastered()">✓ 我已经完全掌握了</button>
        </div>
      </div>
      <div class="hint">点击显示详情</div>
    </div>
    <div class="nav" id="studyNav">
      <button id="prevBtn" onclick="prevWord()">‹ 上一个</button>
      <button id="nextBtn" onclick="nextWord()">下一个 ›</button>
    </div>
  </div>

  <div id="listView" class="hidden" style="display:flex; flex-direction:column; height:100%;">
    <div class="topbar"><span>所有分组</span><button onclick="showStudy()">返回</button></div>
    <div class="group-list" id="groupList"></div>
  </div>

  <div id="masteredView" class="hidden" style="display:flex; flex-direction:column; height:100%;">
    <div class="topbar"><span>熟词区（已掌握）</span><button onclick="showStudy()">返回</button></div>
    <div class="group-list" id="masteredList"></div>
  </div>

  <div id="settingsView" class="hidden" style="display:flex; flex-direction:column; height:100%;">
    <div class="topbar"><span>设置</span><button onclick="showStudy()">返回</button></div>
    <div class="settings">
      <div class="setting-row">
        <label>每天单词数</label>
        <select id="dailySelect" onchange="changeDaily(this.value)">
          <option value="10">10</option><option value="20">20</option><option value="50">50</option>
          <option value="100">100</option><option value="200">200</option><option value="500">500 (极速)</option>
        </select>
      </div>
      <div class="setting-row">
        <label>起始日期</label>
        <input type="date" id="startDate" onchange="changeStartDate(this.value)">
      </div>
      <div class="setting-row">
        <label>朗读语速</label>
        <select id="rateSelect" onchange="changeRate(this.value)">
          <option value="0.7">慢</option><option value="0.9">正常偏慢</option><option value="1">正常</option><option value="1.2">快</option>
        </select>
      </div>
      <div class="setting-row">
        <label>翻页自动朗读</label>
        <label class="switch"><input type="checkbox" id="autoSpeakToggle" onchange="changeAutoSpeak(this.checked)"><span class="slider"></span></label>
      </div>
      <button class="danger-btn" onclick="resetProgress()">重置所有进度</button>
    </div>
  </div>
</div>

<!-- 这一行就是核心：把刚才建好的词库文件引进来 -->
<script src="words.js"></script>

<script>
/* ========== 状态管理 ========== */
const STORAGE_KEY = "cet6_word_app_split_v1";
let state = loadState();
// 这里的 WORDS 直接读取 words.js 里的 MY_WORDS
let WORDS = (typeof MY_WORDS !== 'undefined') ? MY_WORDS : []; 

function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try { return JSON.parse(raw); } catch(e) {}
  }
  return { dailyNew: 20, startDate: todayStr(), rate: 0.9, autoSpeak: true, completed: {}, mastered: [] };
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function todayStr() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function daysBetween(a, b) { return Math.floor((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
function todayGroupIndex() { return Math.max(0, daysBetween(state.startDate, todayStr())); }

function getUnmasteredWords() { return WORDS.filter(w => !state.mastered.includes(w.word)); }
function getGroupWords(groupIdx) { const active = getUnmasteredWords(); return active.slice(groupIdx * state.dailyNew, (groupIdx + 1) * state.dailyNew); }
function totalGroups() { return Math.ceil(getUnmasteredWords().length / state.dailyNew); }
function dateOfGroup(idx) { const d = new Date(state.startDate + "T00:00:00"); d.setDate(d.getDate() + idx); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

function updateProgress() {
  const total = WORDS.length;
  const masteredCount = state.mastered.length;
  const percent = total === 0 ? 0 : Math.round((masteredCount / total) * 100);
  document.getElementById("progressText").textContent = `${masteredCount} / ${total}`;
  document.getElementById("progressBar").style.width = `${percent}%`;
}

let englishVoice = null;
function pickVoice() {
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;
  englishVoice = voices.find(v => v.lang === "en-US" && /female|Samantha|Zira/i.test(v.name)) || voices.find(v => v.lang === "en-US") || voices.find(v => v.lang.startsWith("en")) || null;
  return englishVoice;
}
if ("speechSynthesis" in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
function speakWord() {
  if (!("speechSynthesis" in window)) return;
  const w = document.getElementById("word").textContent;
  if (!w) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(w);
  utter.lang = "en-US"; utter.rate = state.rate || 0.9; utter.pitch = 1;
  if (!englishVoice) pickVoice();
  if (englishVoice) utter.voice = englishVoice;
  window.speechSynthesis.speak(utter);
}

const studyView = document.getElementById("studyView"), listView = document.getElementById("listView"), masteredView = document.getElementById("masteredView"), settingsView = document.getElementById("settingsView");
function hideAll() { studyView.classList.add("hidden"); listView.classList.add("hidden"); masteredView.classList.add("hidden"); settingsView.classList.add("hidden"); }
function showStudy() { hideAll(); studyView.classList.remove("hidden"); updateProgress(); renderStudy(); }
function showList() { hideAll(); listView.classList.remove("hidden"); renderList(); }
function showMastered() { hideAll(); masteredView.classList.remove("hidden"); renderMasteredList(); }
function showSettings() { hideAll(); settingsView.classList.remove("hidden"); renderSettings(); }

let currentGroup = 0, currentIndex = 0;
function renderStudy(auto = true) {
  if (WORDS.length === 0) {
    document.getElementById("word").textContent = "无词库";
    document.getElementById("details").innerHTML = '<div class="section"><div class="defCn">请检查 words.js 是否存在且格式正确。</div></div>';
    return;
  }
  currentGroup = todayGroupIndex();
  const words = getGroupWords(currentGroup);
  if (words.length === 0) {
    document.getElementById("dayLabel").textContent = "当前组已学完";
    document.getElementById("word").textContent = "🎉";
    document.getElementById("phonetic").textContent = "";
    document.getElementById("details").innerHTML = '<div class="section"><div class="defCn">今天的单词已经学完啦！</div></div>';
    document.getElementById("prevBtn").disabled = true; document.getElementById("nextBtn").disabled = true; return;
  }
  if (currentIndex >= words.length) currentIndex = words.length - 1;
  if (currentIndex < 0) currentIndex = 0;
  document.getElementById("dayLabel").textContent = `第 ${currentGroup + 1} 天 · ${currentIndex + 1}/${words.length}`;
  const w = words[currentIndex];
  document.getElementById("word").textContent = w.word;
  document.getElementById("phonetic").textContent = w.phonetic || "";
  document.getElementById("defCn").innerHTML = (w.defCn && w.defCn.length > 0) ? w.defCn.map((d, i) => `<div class="def-cn">${i + 1}. ${d}</div>`).join("") : '<div class="def-cn">暂无中文释义</div>';
  document.getElementById("exampleEn").textContent = w.exampleEn || "";
  document.getElementById("exampleCn").textContent = w.exampleCn || "";
  document.getElementById("card").classList.remove("revealed");
  document.getElementById("prevBtn").disabled = currentIndex === 0;
  document.getElementById("nextBtn").disabled = currentIndex === words.length - 1;
  if (!state.completed[todayStr()]) { state.completed[todayStr()] = true; saveState(); }
  if (auto && state.autoSpeak) { try { speakWord(); } catch(e) {} }
}
function reveal() { document.getElementById("card").classList.add("revealed"); }
function prevWord() { if (currentIndex > 0) { currentIndex--; renderStudy(true); } }
function nextWord() { const words = getGroupWords(currentGroup); if (currentIndex < words.length - 1) { currentIndex++; renderStudy(true); } }
function markMastered() {
  const word = document.getElementById("word").textContent;
  if (!word || word === "🎉") return;
  if (!state.mastered.includes(word)) { state.mastered.push(word); saveState(); }
  const words = getGroupWords(currentGroup);
  if (currentIndex >= words.length) currentIndex = Math.max(0, words.length - 1);
  updateProgress(); renderStudy(false);
}
function renderList() {
  const container = document.getElementById("groupList"); container.innerHTML = "";
  const total = totalGroups(); const today = todayGroupIndex();
  for (let i = 0; i < total; i++) {
    const words = getGroupWords(i); if (words.length === 0) continue;
    const div = document.createElement("div");
    div.className = "group-item" + (i === today ? " today" : "");
    div.innerHTML = `<span class="label">第 ${i + 1} 天${i === today ? " · 今天" : ""}</span><span class="meta">${words.length} 词 ${state.completed[dateOfGroup(i)] ? '<span class="done">✓</span>' : ""}</span>`;
    div.onclick = () => { currentGroup = i; currentIndex = 0; hideAll(); studyView.classList.remove("hidden"); renderStudy(); };
    container.appendChild(div);
  }
}
function renderMasteredList() {
  const container = document.getElementById("masteredList"); container.innerHTML = "";
  if (state.mastered.length === 0) { container.innerHTML = '<div style="text-align:center; color:#999; padding:40px;">还没有已掌握的单词</div>'; return; }
  state.mastered.forEach(wordStr => {
    const div = document.createElement("div"); div.className = "group-item"; div.style.cursor = "default";
    div.innerHTML = `<span class="label">${wordStr}</span><button onclick="unmaster('${wordStr}')" style="background:none; border:1px solid #ccc; padding:4px 10px; border-radius:6px; color:#666; cursor:pointer; font-size:12px;">移出</button>`;
    container.appendChild(div);
  });
}
function unmaster(word) { state.mastered = state.mastered.filter(w => w !== word); saveState(); updateProgress(); renderMasteredList(); }
function renderSettings() {
  document.getElementById("dailySelect").value = state.dailyNew; document.getElementById("startDate").value = state.startDate;
  document.getElementById("rateSelect").value = state.rate || 0.9; document.getElementById("autoSpeakToggle").checked = state.autoSpeak !== false;
}
function changeDaily(val) { state.dailyNew = parseInt(val, 10); saveState(); }
function changeStartDate(val) { state.startDate = val; saveState(); }
function changeRate(val) { state.rate = parseFloat(val); saveState(); }
function changeAutoSpeak(val) { state.autoSpeak = val; saveState(); }
function resetProgress() { if (confirm("确定重置所有进度吗？")) { localStorage.removeItem(STORAGE_KEY); state = loadState(); currentIndex = 0; showStudy(); } }

if (!state.mastered) state.mastered = [];
if (state.autoSpeak === undefined) state.autoSpeak = true;
showStudy();
</script>
</body>
</html>
